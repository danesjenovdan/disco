volumes:
  postgres-data:


services:
  wagtail:
    build: ./disco
    working_dir: /app
    command: ./manage.py runserver 0.0.0.0:8000
    volumes:
      - ./disco:/app:delegated,rw
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: disco.settings.k8s
      DJANGO_DEBUG: "true"
      DJANGO_DATABASE_HOST: db
      DJANGO_DATABASE_NAME: disco
      DJANGO_DATABASE_USER: disco
      DJANGO_DATABASE_PASSWORD: changeme
    depends_on:
      - db

  sass-compile:
    build: ./sass-compile
    working_dir: /app
    command: npm run watch
    volumes:
      - ./sass-compile/scss:/app/scss:delegated,rw
      - ./disco/disco/static:/app/static:delegated,rw
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: disco
      POSTGRES_USER: disco
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
